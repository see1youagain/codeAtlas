name: codeatlas

services:
  codeatlas:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ADDRESS: ":8080"
      REPOSITORY_ROOT: /workspace/repository
      RUNTIME_ROOT: /data/runtime
      DATA_PATH: /data/codeatlas.db
      ENABLE_WRITE: "${ENABLE_WRITE:-false}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      MODEL_BASE_URL: "${MODEL_BASE_URL:-https://api.openai.com/v1}"
      MODEL_API_KEY: "${MODEL_API_KEY:-}"
      MODEL_NAME: "${MODEL_NAME:-gpt-4.1-mini}"
      MODEL_TIMEOUT_SECONDS: "${MODEL_TIMEOUT_SECONDS:-60}"
      AGENT_MAX_ITERATIONS: "${AGENT_MAX_ITERATIONS:-8}"
    volumes:
      - "${HOST_REPOSITORY_PATH}:/workspace/repository:ro"
      - "codeatlas-data:/data"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  codeatlas-data:
